# Custom values for kube-prometheus-stack
# Configured for EKS Auto Mode stability with do-not-disrupt & High Availability

alertmanager:
  enabled: false

grafana:
  enabled: true
  replicas: 2
  adminPassword: "prom-operator"
  defaultDashboardsEnabled: true
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 5
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 5
    failureThreshold: 10
  podDisruptionBudget:
    minAvailable: 1
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

prometheus:
  enabled: true
  prometheusSpec:
    podMetadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 10d
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "1000m"
        memory: "2Gi"

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
