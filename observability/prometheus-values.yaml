# Custom values for kube-prometheus-stack
# Modeled after production GitOps setup with AWS EKS and Slack Alerting

grafana:
  enabled: true
  adminPassword: "prom-operator"
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 10d
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
  