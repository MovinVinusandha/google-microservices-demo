# Custom values for kube-prometheus-stack
# Configured for EKS Auto Mode stability with do-not-disrupt

grafana:
  enabled: true
  adminPassword: "prom-operator"
  defaultDashboardsEnabled: true
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

prometheus:
  enabled: true
  prometheusSpec:
    podMetadata:
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 10d
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
  